# 로컬 개발용 PostgreSQL. 백엔드 서버와 Ollama는 맥에서 직접 실행한다.
#   켜기: docker compose up -d
#   끄기: docker compose stop        (데이터 유지)
#   삭제: docker compose down -v     (데이터까지 삭제, 주의)
services:
  db:
    # 공식 Postgres 17에 pgvector(벡터 검색 확장)가 미리 설치된 이미지. RAG의 문서 임베딩 저장 · 검색에 쓴다.
    # 배포할 AWS RDS와 같은 메이저 버전(17)으로 맞춘다. RDS도 pgvector 확장을 지원한다.
    image: pgvector/pgvector:pg17
    environment:
      # 로컬 전용 계정. 운영 비밀번호는 절대 여기 적지 않는다 (운영은 SSM Parameter Store)
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: chatbot
      POSTGRES_DB: chatbot
    ports:
      # 127.0.0.1에만 열어서 같은 와이파이의 다른 기기에서는 접속할 수 없게 한다
      - "127.0.0.1:5432:5432"
    volumes:
      # 컨테이너를 지웠다 다시 만들어도 데이터가 남도록 이름 있는 볼륨에 저장
      # postgres:17-alpine → pgvector(Debian 기반)로 바꾸면서 볼륨을 새로 만들었다.
      # alpine(musl)과 Debian(glibc)은 문자열 정렬 규칙이 달라서, 기존 데이터 폴더를 그대로 쓰면
      # 텍스트 인덱스(이메일 unique 등)가 어긋날 수 있다. 그래서 pg_dump로 옮겼다.
      # 예전 볼륨(db-data)은 백업으로 남아 있다. 필요 없으면: docker volume rm llm-chatbot-backend_db-data
      - db-data-pgvector:/var/lib/postgresql/data
    healthcheck:
      # `docker compose ps`에서 접속 가능한 상태인지(healthy) 보여준다
      test: ["CMD-SHELL", "pg_isready -U chatbot -d chatbot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data-pgvector:
