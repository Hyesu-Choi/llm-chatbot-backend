# 로컬 개발용 PostgreSQL. 백엔드 서버와 Ollama는 맥에서 직접 실행한다.
#   켜기: docker compose up -d
#   끄기: docker compose stop        (데이터 유지)
#   삭제: docker compose down -v     (데이터까지 삭제, 주의)
services:
  db:
    # 배포할 AWS RDS와 같은 메이저 버전으로 맞춘다
    image: postgres:17-alpine
    environment:
      # 로컬 전용 계정. 운영 비밀번호는 절대 여기 적지 않는다 (운영은 SSM Parameter Store)
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: chatbot
      POSTGRES_DB: chatbot
    ports:
      # 127.0.0.1에만 열어서 같은 와이파이의 다른 기기에서는 접속할 수 없게 한다
      - "127.0.0.1:5432:5432"
    volumes:
      # 컨테이너를 지웠다 다시 만들어도 데이터가 남도록 이름 있는 볼륨에 저장
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # `docker compose ps`에서 접속 가능한 상태인지(healthy) 보여준다
      test: ["CMD-SHELL", "pg_isready -U chatbot -d chatbot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
