# 운영(EC2) 서버에서 띄우는 전체 구성. 로컬 개발용은 루트의 docker-compose.yml(DB만)이다.
#
#   인터넷 ─▶ CloudFront ─▶ [EC2 :80] nginx ─▶ backend ─┬─▶ ollama (gemma3:4b, bge-m3)
#                                                        └─▶ RDS PostgreSQL (EC2 밖, AWS 관리형)
#
# 같은 폴더의 .env를 두 군데서 쓴다 (예시: deploy/.env.example):
#   1. 아래 ${BACKEND_IMAGE} 같은 변수 치환: compose가 이 파일을 읽을 때 .env를 자동으로 읽는다
#   2. env_file: .env → 컨테이너 안의 환경 변수 (app/config.py의 Settings가 읽는다)
#
# 실행 (EC2의 deploy 폴더에서):
#   docker compose up -d          전부 켜기 (처음엔 모델 다운로드로 몇 분 걸림)
#   docker compose ps             상태 확인
#   docker compose logs -f backend
#   docker compose down           끄기 (모델은 볼륨에 남아서 다음엔 바로 뜬다)
#
# 맥에서 미리 시험해 보기: docs/deploy.md의 "로컬에서 운영 구성 시험하기"
#
# 이 파일에 나오는 compose 문법:
#   ${VAR:?메시지}   VAR가 비어 있으면 메시지를 보여 주고 멈춘다 (필수 값 빠뜨림 방지)
#   ${VAR:-기본값}   VAR가 비어 있으면 기본값을 쓴다
#   depends_on + condition
#     service_healthy                 상대 컨테이너의 healthcheck가 통과할 때까지 기다린다
#     service_completed_successfully  상대 컨테이너가 종료 코드 0으로 끝날 때까지 기다린다
#   (condition 없이 depends_on만 쓰면 "켜지기 시작"만 기다려서, DB 준비 전에 앱이 붙다가 실패할 수 있다)

services:
  # 인터넷에서 들어오는 요청을 받아 backend로 넘기는 리버스 프록시. 설정은 nginx.conf
  nginx:
    image: nginx:1.28-alpine
    ports:
      # EC2의 80번 포트 → 컨테이너 80번. 보안 그룹에서 CloudFront만 들어올 수 있게 막는다
      - "80:80"
    volumes:
      # :ro = 읽기 전용. 컨테이너가 설정 파일을 바꿀 수 없게
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    # 서버가 재부팅되거나 컨테이너가 죽으면 자동으로 다시 켠다 (직접 stop한 경우는 제외)
    restart: unless-stopped

  backend:
    # ECR에 올린 이미지. GitHub Actions가 새 이미지를 올리면 태그만 바꿔서 다시 띄운다
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE를 .env에 넣어 주세요}
    env_file: .env
    # environment는 env_file보다 우선한다. .env에 LLM_BASE_URL이 있어도 아래 값이 이긴다
    environment:
      # 같은 compose 안의 컨테이너는 서비스 이름(ollama)으로 서로 찾는다. localhost가 아니다!
      # (컨테이너 안의 localhost는 그 컨테이너 자신)
      LLM_BASE_URL: http://ollama:11434/v1
    # 포트를 밖으로 열지 않는다 (ports 없음). nginx만 내부 네트워크로 접근한다
    depends_on:
      # DB 구조 갱신이 "성공적으로 끝난" 뒤에만 서버를 켠다
      migrate:
        condition: service_completed_successfully
      # 모델 다운로드가 끝나야 첫 질문부터 답할 수 있다
      ollama-pull:
        condition: service_completed_successfully
    # healthcheck: docker가 interval마다 test 명령을 실행해서, 성공하면 healthy · retries번 연속 실패하면 unhealthy.
    # "컨테이너가 켜져 있음"과 "실제로 요청을 받을 수 있음"은 다르다. 그 차이를 확인하는 장치
    healthcheck:
      # 이미지에 curl이 없어서 파이썬으로 /health를 부른다. 실패하면 예외 → 0이 아닌 종료 코드 → unhealthy
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # 배포할 때마다 한 번 실행되고 끝나는 컨테이너. 이미지는 backend와 같고 명령만 다르다.
  # 이미 최신이면 alembic이 아무것도 안 하고 바로 끝나서 매번 돌려도 안전하다.
  migrate:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE를 .env에 넣어 주세요}
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    # 한 번 끝나면 다시 켜지 않는다
    restart: "no"

  # 로컬 맥에서 쓰던 Ollama를 컨테이너로. EC2에는 GPU가 없어서 CPU로 돈다 (맥보다 느림)
  ollama:
    image: ollama/ollama:0.40.0
    volumes:
      # 받은 모델(수 GB)을 볼륨에 저장해서 컨테이너를 다시 만들어도 다시 받지 않게
      - ollama-models:/root/.ollama
    environment:
      # 마지막 요청 후 모델을 메모리에 얼마나 들고 있을지. 기본 5분이 지나면 내렸다가
      # 다음 질문 때 다시 올리느라(CPU에선 몇 초) 느려지므로 길게 잡는다
      OLLAMA_KEEP_ALIVE: 24h
    healthcheck:
      # ollama 서버가 응답하면 성공 (이미지에 ollama 명령이 들어 있다)
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 모델을 받고 끝나는 1회용 컨테이너. 로컬에서 직접 치던 `ollama pull`을 자동으로 한다.
  # 이미 받은 모델이면 바뀐 부분만 확인하고 금방 끝난다.
  ollama-pull:
    image: ollama/ollama:0.40.0
    environment:
      # ollama 명령이 자기 자신 대신 ollama 컨테이너에 요청하게
      OLLAMA_HOST: http://ollama:11434
    # 이미지의 기본 시작 명령(ollama serve) 대신 셸 명령을 실행
    entrypoint: ["/bin/sh", "-c"]
    # 받을 모델 이름도 .env에서 가져와서 백엔드 설정과 어긋나지 않게 한다
    command: ["ollama pull ${LLM_MODEL:-gemma3:4b} && ollama pull ${EMBEDDING_MODEL:-bge-m3}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  ollama-models:
