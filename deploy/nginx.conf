# EC2에서 인터넷 요청을 받아 backend 컨테이너로 넘기는 nginx 설정 (리버스 프록시).
# FastAPI(uvicorn)를 바로 노출하지 않고 nginx를 앞에 두는 이유:
#   - 느린 클라이언트 · 큰 요청 처리, 요청 크기 제한 같은 일을 검증된 웹 서버가 맡는다
#   - 나중에 HTTPS 인증서, 정적 파일, 여러 백엔드 분배를 붙일 자리가 생긴다

# 오류 페이지와 응답 헤더에 nginx 버전을 숨긴다 (공격자에게 정보를 덜 준다)
server_tokens off;

server {
    listen 80;

    # 업로드 최대 크기. 문서 제한(app/config.py의 document_max_bytes = 1MB)보다 살짝 크게.
    # nginx 기본값은 1MB라서 그대로 두면 1MB 문서가 백엔드까지 가지도 못하고 413으로 막힌다
    client_max_body_size 2m;

    location /api/ {
        # "backend"는 docker-compose.yml의 서비스 이름. 같은 compose 네트워크 안에서 이름으로 찾는다
        proxy_pass http://backend:8000;

        # 원래 요청 정보를 백엔드에 전달 (안 넘기면 백엔드는 모든 요청이 nginx에서 온 걸로 안다)
        # Host: 사용자가 접속한 도메인 이름
        # X-Real-IP / X-Forwarded-For: 요청을 보낸 쪽 IP. $proxy_add_x_forwarded_for는 앞에서 이미 붙은 값
        #   (CloudFront가 붙인 실제 사용자 IP) 뒤에 바로 앞 IP를 이어 붙인다 → "사용자, CloudFront" 순서
        # X-Forwarded-Proto: 원래 요청이 http인지 https인지
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ★ 스트리밍 답변에 필수.
        # nginx는 기본으로 백엔드 응답을 모아 뒀다가(버퍼링) 한꺼번에 보낸다.
        # 그러면 글자가 하나씩 나오던 답변이 다 만들어질 때까지 멈춰 있다가 한 번에 뜬다.
        proxy_buffering off;
        # 백엔드와 HTTP/1.1로 대화한다 (기본은 1.0). 청크 단위 전송(스트리밍)과 연결 재사용이 1.1 기능이다
        proxy_http_version 1.1;

        # 백엔드 응답을 기다리는 최대 시간 (기본 60초).
        # EC2에는 GPU가 없어서 CPU로 긴 답변을 만들면 60초를 넘을 수 있다
        proxy_read_timeout 300s;
    }

    # 서버 상태 확인용 (app/main.py의 /health). CloudFront는 /api/*만 보내므로 EC2 안에서 확인할 때 쓴다
    location = /health {
        proxy_pass http://backend:8000;
    }

    # 그 밖의 주소는 이 서버가 다루지 않는다. 프론트 화면은 S3 + CloudFront가 준다
    location / {
        return 404;
    }
}
