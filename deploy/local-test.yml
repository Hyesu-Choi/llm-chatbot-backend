# 운영 구성(docker-compose.yml)을 맥에서 시험해 보기 위한 "덮어쓰기" 파일.
# compose는 -f를 여러 개 주면 뒤 파일 내용을 앞 파일 위에 덮어쓴다. 운영 파일은 그대로 두고 다른 부분만 여기 적는다.
#
# 운영과 다른 점:
#   - DB: RDS 대신 맥의 로컬 Postgres(루트 docker-compose.yml)에 만든 시험용 DB chatbot_deploytest
#   - LLM: Ollama 컨테이너(CPU, 모델 다운로드 수 GB) 대신 맥에서 이미 돌고 있는 Ollama(GPU)
#   - 포트: 80 대신 8088 (8080은 다른 개발 서버가 자주 쓴다), 그리고 내 맥(127.0.0.1)에서만 접속 가능
#
# 실행 방법은 docs/deploy.md의 "로컬에서 운영 구성 시험하기"

services:
  nginx:
    # !override: 합치지 말고 통째로 바꾼다 (ports는 목록이라 그냥 쓰면 80과 8088이 둘 다 열린다)
    ports: !override ["127.0.0.1:8088:80"]

  backend:
    # !reset: 운영 파일의 env_file(.env)을 지운다. 시험용 값은 아래 environment에 바로 적는다
    env_file: !reset []
    # &test-env: 이 묶음에 이름표(앵커)를 붙여서 아래 migrate에서 *test-env로 그대로 재사용
    environment: &test-env
      # host.docker.internal: 컨테이너 안에서 "이 컨테이너를 띄운 맥"을 가리키는 Docker Desktop 전용 주소
      DATABASE_URL: postgresql+asyncpg://chatbot:chatbot@host.docker.internal:5432/chatbot_deploytest
      LLM_BASE_URL: http://host.docker.internal:11434/v1
      # 시험 전용 키. 운영에서는 절대 이런 고정값을 쓰지 않는다
      JWT_SECRET: local-test-only-not-a-real-secret-0123456789
      COOKIE_SECURE: "false"
      LLM_MODEL: gemma3:4b
      LLM_MODELS: "[]"
      CORS_ORIGINS: "[]"
    # Ollama 컨테이너를 안 쓰니 ollama-pull을 기다리지 않게 의존 관계를 바꾼다
    depends_on: !override
      migrate:
        condition: service_completed_successfully

  migrate:
    env_file: !reset []
    environment: *test-env
