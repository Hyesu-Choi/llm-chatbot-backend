[project]
name = "llm-chatbot-backend"
version = "0.1.0"
description = "NVIDIA Build 스트리밍 챗봇 API (FastAPI)"
authors = [
    { name = "hyesuChoi", email = "hsc1263@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "email-validator>=2.3.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "pgvector>=0.5.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# 프로젝트 루트를 import 경로에 넣어서 테스트에서 `from app...`, `from tests.helpers ...`를 쓸 수 있게
pythonpath = ["."]
# FastAPI TestClient 내부의 라이브러리 경고. 우리 코드 문제가 아니라서 출력에서만 숨긴다
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient. is deprecated"]
