[project]
name = "llm-chatbot-backend"
version = "0.1.0"
description = "NVIDIA Build 스트리밍 챗봇 API (FastAPI)"
authors = [
    { name = "hyesuChoi", email = "hsc1263@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "email-validator>=2.3.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
]

[tool.uv]
package = false
